name: Deployment Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        brances: [main]
        types: [opened, synchronize]

jobs:
    simple_deployment_pipeline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4 #Conceptualmete, clona mi repositorio
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: install dependencies
              run: npm install
            - name: lint
              run: npm run eslint
            - name: build
              run: npm run build
            - name: test
              run: npm run test

            - name: Deploy
              env:
                  deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
              run: curl "$deploy_url"
